name: shiprig release
description: Automate releases with shiprig across every ecosystem it supports, from changesets or conventional commits

runs:
  using: "node24"
  main: "dist/index.js"
inputs:
  github-token:
    description: >
      The GitHub token to use for authentication. Defaults to the GitHub-provided token.
      To use a custom token, pass it explicitly to this input.
    required: false
    default: ${{ github.token }}
  publish-script:
    description: "The command to use to build and publish packages, e.g. `shiprig publish --yes`. The action sets CHANGESETS_OUTPUT to a file; `shiprig publish` (or `shiprig tag`) writes an event there for each tag it creates, and the action reads them back to push the tags and create releases."
    required: false
  version-script:
    description: "The command to update versions, edit CHANGELOGs, and consume changesets. Defaults to `shiprig version --yes`"
    required: false
  commit-message:
    description: "The commit message. Defaults to the pull request's default title. Can also be set as `commitMessage` in `shiprig-action.jsonc`; this input wins over the file."
    required: false
  pr-title:
    description: >
      The pull request title. Defaults to `chore: release` plus what it releases:
      `chore: release 1.2.0` when everything shares one version,
      `chore: release core@1.2.0, ui@0.5.0` for up to three packages, and
      `chore: release 5 packages` beyond that.
      Can also be set as `prTitle` in `shiprig-action.jsonc`; this input wins over the file.
    required: false
  pr-draft:
    description: "Controls draft PR behavior. Use 'create' to create new version PRs as draft, or 'always' to also convert existing version PRs back to draft when updating them. Can also be set as `prDraft` in `shiprig-action.jsonc`; this input wins over the file."
    required: false
  pr-base-branch:
    description: "Sets the base branch of the PR. Defaults to `github.ref_name`. Can also be set as `prBaseBranch` in `shiprig-action.jsonc`; this input wins over the file."
    required: false
  create-github-releases:
    description: "Whether to create GitHub releases after publish. Defaults to `true`. Can also be set as `createGithubReleases` in `shiprig-action.jsonc`; this input wins over the file."
    required: false
  comment-released-prs:
    description: >
      Whether to comment "released in" on each pull request whose changeset shipped, once the
      tags are pushed. Defaults to `true`. Can also be set as `commentReleasedPrs` in
      `shiprig-action.jsonc`; this input wins over the file.
    required: false
  push-git-tags:
    description: >
      Whether to create git tags after publish. If `create-github-releases` is set to `true`,
      this option will also always be `true`.
      Defaults to `true`. Can also be set as `pushGitTags` in `shiprig-action.jsonc`; this input wins over the file.
    required: false
  publish-on:
    description: >
      When the publish path runs, once no changesets are pending. `version-pr-merge` (the
      default): only on the push that merges the version PR (`changeset-release/<base>`),
      and on a run started by hand (`workflow_dispatch`); other events don't publish.
      `every-push`: on every push with nothing pending,
      as changesets/action does, relying on the publish script to skip what's already out.
      Can also be set as `publishOn` in `shiprig-action.jsonc`; this input wins over the file.
    required: false
  push-with-git-cli:
    description: >
      Whether to use the Git CLI instead of the GitHub API to push release commits and tags.
      Defaults to `false`. When using the GitHub API, commits and tags are signed using
      GitHub's GPG key and attributed to the user or app that owns the `github-token`.
      Can also be set as `pushWithGitCli` in `shiprig-action.jsonc`; this input wins over the file.
    required: false
  cwd:
    description: "The working directory to run shiprig in. Defaults to the root of the repository."
    required: false
outputs:
  published:
    description: A "true" or "false" string value to indicate whether the publish script reported any tag (a `git-tag` event through CHANGESETS_OUTPUT, which `shiprig publish` and `shiprig tag` write). It reflects those reports, not a registry check.
  published-packages:
    description: >
      A JSON array of the packages whose tags the publish script reported, each at its version when the script ran, e.g. `[{"name": "@xx/xx", "version": "1.2.0"}, {"name": "@xx/xy", "version": "0.8.9"}]`
  has-changesets:
    description: A "true" or "false" string value about whether changeset files exist (including those waiting in .changeset/pre/ after `pre exit`). A release from conventional commits alone doesn't set it.
  pr-number:
    description: The pull request number that was created or updated
branding:
  icon: "package"
  color: "blue"
