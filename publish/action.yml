name: shiprig release - Publish
description: Publish packages to npm
runs:
  using: node24
  main: ../dist/publish.js
inputs:
  github-token:
    description: >
      The GitHub token to use for authentication. Defaults to the GitHub-provided token.
      To use a custom token, pass it explicitly to this input.
    required: false
    default: ${{ github.token }}
  script:
    description: "The command to use to publish packages"
    required: false
  pack-dir-artifact-id:
    description: "The artifact id the pack sub-action output: publish exactly those files with `shiprig publish --from-pack-dir`, building nothing. Can't be combined with `script`."
    required: false
  create-github-releases:
    description: "Whether to create Github releases after publish. Defaults to `true`. Can also be set as `createGithubReleases` in `shiprig-action.jsonc`; this input wins over the file."
    required: false
  comment-released-prs:
    description: >
      Whether to comment "released in" on each pull request whose changeset shipped, once the
      tags are pushed. Defaults to `true`. Can also be set as `commentReleasedPrs` in
      `shiprig-action.jsonc`; this input wins over the file.
    required: false
  push-git-tags:
    description: >
      Whether to create git tags after publish. If `create-github-releases` is set to `true`,
      this option will also always be `true`.
      Defaults to `true`. Can also be set as `pushGitTags` in `shiprig-action.jsonc`; this input wins over the file.
    required: false
  cwd:
    description: "The working directory to run shiprig (or the custom script) in. Defaults to the root of the repository."
    required: false
outputs:
  published:
    description: A "true" or "false" string value to indicate whether the publish script reported any tag (a `git-tag` event through CHANGESETS_OUTPUT). It reflects those reports, not a registry check.
  published-packages:
    description: >
      A JSON array of the packages whose tags the publish script reported (a `git-tag` event through CHANGESETS_OUTPUT), each at its version when the script ran, e.g. `[{"name": "@xx/xx", "version": "1.2.0"}, {"name": "@xx/xy", "version": "0.8.9"}]`
branding:
  icon: package
  color: blue
