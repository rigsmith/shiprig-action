blockExoticSubdeps: true
dedupePeers: true
dedupePeerDependents: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@changesets/apply-release-plan@8.0.0"
  - "@changesets/assemble-release-plan@7.0.0"
  - "@changesets/changelog-git@1.0.0"
  - "@changesets/changelog-github@1.0.0"
  - "@changesets/cli@3.0.0"
  - "@changesets/config@4.0.0"
  - "@changesets/errors@1.0.0"
  - "@changesets/get-dependents-graph@3.0.0"
  - "@changesets/get-github-info@1.0.0"
  - "@changesets/get-release-plan@5.0.0"
  - "@changesets/git@4.0.0"
  - "@changesets/parse@1.0.0"
  - "@changesets/pre@3.0.0"
  - "@changesets/read@1.0.0"
  - "@changesets/should-skip-package@1.0.0"
  - "@changesets/types@7.0.0"
  - "@changesets/write@1.0.0"
  - "vite@8.2.0"
  # First-party: shiprig, which the tests run, published from rigsmith's
  # release workflow with provenance. Pinned per version, as above.
  - "@rigsmith/shiprig@1.21.0"
  - "@rigsmith/shiprig-darwin-arm64@1.21.0"
  - "@rigsmith/shiprig-darwin-x64@1.21.0"
  - "@rigsmith/shiprig-linux-arm64@1.21.0"
  - "@rigsmith/shiprig-linux-x64@1.21.0"
  - "@rigsmith/shiprig-win32-arm64@1.21.0"
  - "@rigsmith/shiprig-win32-x64@1.21.0"

overrides:
  lightningcss: "-" # we do not bundle any css
  postcss: "-" # we do not bundle any css

shellEmulator: true
trustPolicy: no-downgrade
