name: Setup CI
description: Setup CI

inputs:
  skip-cache:
    description: "Whether to skip the cache"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check out repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Set up pnpm
      uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".node-version"
        package-manager-cache: ${{ inputs.skip-cache != 'true' }}
        cache: ${{ inputs.skip-cache != 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The tests run the real shiprig (docs/DESIGN.md): the released 1.20.0, the
    # first with every contract the action uses, pinned to the exact version
    # and installed from npm (published with provenance). It goes to a fixed
    # path the test step names itself (SHIPRIG_BIN), rather than being exported
    # through GITHUB_ENV, which zizmor flags as an injection surface.
    - name: Install shiprig
      shell: bash
      env:
        SHIPRIG_VERSION: 1.20.0
      run: npm install --prefix "$RUNNER_TEMP/shiprig" --no-audit --no-fund "@rigsmith/shiprig@${SHIPRIG_VERSION}"
