name: Setup CI
description: Setup CI

inputs:
  skip-cache:
    description: "Whether to skip the cache"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check out repo
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Set up pnpm
      uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".node-version"
        package-manager-cache: ${{ inputs.skip-cache != 'true' }}
        cache: ${{ inputs.skip-cache != 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The tests run the real shiprig (docs/DESIGN.md). Pinned to the rigsmith
    # commit that carries every contract the action uses, until a release
    # (>= 1.20.0) does; then this becomes a released binary.
    - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
      with:
        go-version: stable
        cache: false

    - name: Install shiprig
      shell: bash
      env:
        SHIPRIG_REF: 68fbee63d7ac1ca5ed0f83dc3fafc7894cd0c25f
      run: |
        GOBIN="$RUNNER_TEMP/shiprig-bin" go install "github.com/rigsmith/rigsmith/cmd/shiprig@${SHIPRIG_REF}"
        echo "SHIPRIG_BIN=$RUNNER_TEMP/shiprig-bin/shiprig" >> "$GITHUB_ENV"
