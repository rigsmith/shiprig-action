name: shiprig release - Version
description: Version packages
runs:
  using: node24
  main: ../dist/version.js
inputs:
  github-token:
    description: >
      The GitHub token to use for authentication. Defaults to the GitHub-provided token.
      To use a custom token, pass it explicitly to this input.
    required: false
    default: ${{ github.token }}
  script:
    description: "The command to use to version packages"
    required: false
  commit-message:
    description: "The commit message. Defaults to the pull request's default title. Can also be set as `commitMessage` in `shiprig-action.jsonc`; this input wins over the file."
    required: false
  pr-title:
    description: >
      The pull request title. Defaults to `chore: release` plus what it releases:
      `chore: release 1.2.0` when everything shares one version,
      `chore: release core@1.2.0, ui@0.5.0` for up to three packages, and
      `chore: release 5 packages` beyond that.
      Can also be set as `prTitle` in `shiprig-action.jsonc`; this input wins over the file.
    required: false
  separate-pull-requests:
    description: >
      Open a version PR per release group (packages that must be versioned together) instead of
      one for everything, so packages can release on their own schedules, as release-please's
      `separate-pull-requests`. Needs shiprig 1.22.0. Defaults to `false`. Can also be set as
      `separatePullRequests` in `shiprig-action.jsonc`; this input wins over the file.
    required: false
  hold-label:
    description: >
      A label on the version PR that stops the action from updating its branch, so it can be
      edited by hand. Defaults to `release:hold`. Can also be set as `holdLabel` in
      `shiprig-action.jsonc`; this input wins over the file.
    required: false
  pr-draft:
    description: "Controls draft PR behavior. Use 'create' to create new version PRs as draft, or 'always' to also convert existing version PRs back to draft when updating them. Can also be set as `prDraft` in `shiprig-action.jsonc`; this input wins over the file."
    required: false
  pr-base-branch:
    description: "Sets the base branch of the PR. Defaults to `github.ref_name`. Can also be set as `prBaseBranch` in `shiprig-action.jsonc`; this input wins over the file."
    required: false
  push-with-git-cli:
    description: >
      Whether to use the Git CLI instead of the GitHub API to push release commits.
      Defaults to `false`. When using the GitHub API, commits are signed using GitHub's
      GPG key and attributed to the user or app that owns the `github-token`.
      Can also be set as `pushWithGitCli` in `shiprig-action.jsonc`; this input wins over the file.
    required: false
  cwd:
    description: "The working directory to run shiprig (or the custom script) in. Defaults to the root of the repository."
    required: false
outputs:
  pr-number:
    description: The pull request number that was created or updated (with separate-pull-requests, the first group's)
  pr-numbers:
    description: A JSON array of every version pull request created or updated, one per release group with separate-pull-requests
branding:
  icon: package
  color: blue
